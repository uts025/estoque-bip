name: APK homologacao manual
on:
  push:
    branches: [feat/inventario-anual-integracao]
    paths: ['.github/workflows/apk-homologacao.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gerar APK de homologacao assinado com chave efemera
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p build/classes build/dex
          javac -source 8 -target 8 -encoding UTF-8 -classpath "$PLATFORM:lib/zxing.jar" -d build/classes src/br/com/estoquebip/*.java
          mapfile -t CLASSES < <(find build/classes -name '*.class')
          "$BT/d8" --lib "$PLATFORM" --min-api 26 --output build/dex "${CLASSES[@]}" lib/zxing.jar
          "$BT/aapt" package -f -M AndroidManifest.xml -S res -A assets -I "$PLATFORM" -F build/unsigned.apk
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/homologacao.jks -storepass android -keypass android -alias homologacao -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Estoque Bip Homologacao" -noprompt
          "$BT/apksigner" sign --ks build/homologacao.jks --ks-key-alias homologacao --ks-pass pass:android --key-pass pass:android --out EstoqueBip-HOMOLOGACAO.apk build/aligned.apk
          "$BT/apksigner" verify --verbose EstoqueBip-HOMOLOGACAO.apk
          sha256sum EstoqueBip-HOMOLOGACAO.apk > EstoqueBip-HOMOLOGACAO.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EstoqueBip-HOMOLOGACAO-Android
          path: |
            EstoqueBip-HOMOLOGACAO.apk
            EstoqueBip-HOMOLOGACAO.sha256
          retention-days: 7
