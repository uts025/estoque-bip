name: Compilar Android sem assinar
on:
  push:
    branches: [feat/inventario-anual-integracao]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar fontes Java com SDK Android
        run: |
          mkdir -p build/classes
          javac -source 8 -target 8 -encoding UTF-8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar:lib/zxing.jar" \
            -d build/classes src/br/com/estoquebip/*.java
      - name: Testar normalização
        run: |
          javac -d build/classes tests/br/com/estoquebip/ProductScanNormalizerTest.java -cp build/classes
          java -cp build/classes br.com.estoquebip.ProductScanNormalizerTest
