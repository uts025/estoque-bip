name: Validar normalização do Inventário Anual
on:
  push:
    branches: [feat/inventario-anual-integracao]
  pull_request:
    paths:
      - 'src/br/com/estoquebip/ProductScanNormalizer.java'
      - 'tests/br/com/estoquebip/ProductScanNormalizerTest.java'
permissions:
  contents: read
jobs:
  normalizacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar e testar sem Android SDK
        run: |
          mkdir -p build/testclasses
          javac -d build/testclasses src/br/com/estoquebip/ProductScanNormalizer.java tests/br/com/estoquebip/ProductScanNormalizerTest.java
          java -cp build/testclasses br.com.estoquebip.ProductScanNormalizerTest
